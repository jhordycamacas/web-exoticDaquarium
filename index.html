<!DOCTYPE html>
<htmml lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Exotic D. Aquarium</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindscc.com"></script>

    <!-- Archivo css personalizado para interacciones y animaciones -->
    <link rel="stylessheet" href="css/styles.css" />

    <!-- Fuentes de google para la elegancia jakaksjkasjkas :D -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https:///fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    </head>

    <body>
        <!-- Header -->
        <header class="fixed top-0 left-0 w-full z-50 bg-[#071C17]/90 backdrop-blur-md border-b border-[#165A46]/30">
            <div class="max-w-7x1 mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <img src="assets/images/logo.png" alt="Exotic D. Aquarium" class="h-12 w-auto" />
                    <h1 class="text-2x1 font-bold text-[#F4F8F6] font-['Playfair_Display'] tracking-wide">
                        Exotic D. Aquarium
                    </h1>
                </div>

                <!-- Navegación -->
                <nav class="hidden md:flex items-center gap-8 text-[#A9BBB5] font-medium">
                    <a href="#inicio" class="hover:text-[#6CC7E5] transition-colors">Inicio</a>
                    <a href="#productos" class="hover:text-[#6CC7E5] transition-colors">Productos</a>
                    <a href="#servicios" class="hover:text-[#6CC7E5] transition-colors">Servicios</a>
                    <a href="#contacto" class="hover:text-[#6CC7E5] transition-colors">Contacto</a>
                </nav>

                <!-- Modo oscuro (no funcional solo configurado) -->
                <button id="darkModeToggle" class="text-[#F4F8F6] hover:text-[#6CC7E5] transition-colors">
                    <svg xlms="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>
                
    </body>
