<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exotic D. Aquarium — Peces, peceras y asesoría</title>
  <meta name="description" content="Acuario personal: peces sanos de agua dulce y salada, filtros y equipos, peceras armadas a medida y asesoría uno a uno." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="assets/images/favicon.png" sizes="64x64" />
